name: Build BlockForge

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install GLFW
        run: |
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip" -OutFile "glfw.zip"
          Expand-Archive glfw.zip -DestinationPath .
          $glfwDir = (Get-ChildItem -Directory glfw-* | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "glfw_deps/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "glfw_deps/lib" | Out-Null
          Copy-Item "$glfwDir/include/*" "glfw_deps/include/" -Recurse -Force
          Copy-Item "$glfwDir/lib-vc2022/*" "glfw_deps/lib/" -Recurse -Force
          Copy-Item "$glfwDir/bin/*" "glfw_deps/lib/" -Recurse -Force
        shell: pwsh

      - name: Download GLM
        run: |
          New-Item -ItemType Directory -Force -Path "glm_deps"
          Invoke-WebRequest -Uri "https://github.com/g-truc/glm/archive/refs/tags/1.0.1.tar.gz" -OutFile "glm.tar.gz"
          tar -xzf glm.tar.gz
          Copy-Item -Recurse "glm-1.0.1/glm" "glm_deps/glm"
        shell: pwsh

      - name: Download nlohmann/json
        run: |
          New-Item -ItemType Directory -Force -Path "nlohmann"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp" -OutFile "nlohmann/json.hpp"
        shell: pwsh

      - name: Download miniaudio
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mackron/miniaudio/master/miniaudio.h" -OutFile "blockforge/miniaudio.h"
        shell: pwsh

      - name: Download stb_image
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h" -OutFile "blockforge/stb_image.h"
        shell: pwsh

      - name: Build
        run: |
          cmake -B build -S blockforge -DBLOCKFORGE_VULKAN_RENDERER=OFF -DCMAKE_PREFIX_PATH="$PWD/glfw_deps;$PWD/glm_deps;$PWD"
          cmake --build build --config Release 2>&1
        shell: pwsh

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockforge-windows
          path: |
            build/Release/blockforge.exe
            build/Release/*.dll   
