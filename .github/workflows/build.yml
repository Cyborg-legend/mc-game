name: Build BlockForge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Fetch GLFW and GLEW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- GLFW ---
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip" -OutFile glfw.zip
          Expand-Archive glfw.zip -DestinationPath glfw_tmp -Force
          $glfwDir = Get-ChildItem -Directory glfw_tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force glfw_deps/include | Out-Null
          Copy-Item "$($glfwDir.FullName)/include/*" glfw_deps/include -Recurse -Force
          $glfwLib = Get-ChildItem -Path $glfwDir.FullName -Recurse -Filter glfw3.lib |
                     Where-Object { $_.FullName -match 'lib-vc2022' } | Select-Object -First 1
          if (-not $glfwLib) {
            $glfwLib = Get-ChildItem -Path $glfwDir.FullName -Recurse -Filter glfw3.lib | Select-Object -First 1
          }
          if (-not $glfwLib) { throw 'glfw3.lib not found in GLFW package' }
          # CMake chokes on Windows backslash escapes in the generated config,
          # so normalise every path to forward slashes (regex, not literal).
          $inc = (Resolve-Path glfw_deps/include).Path -replace '\\','/'
          $lib = $glfwLib.FullName -replace '\\','/'
          if ($inc -match '\\' -or $lib -match '\\') { throw 'backslash left in GLFW paths' }
          @"
          set(glfw3_FOUND TRUE)
          set(glfw3_INCLUDE_DIRS "$inc")
          set(glfw3_LIBRARIES "$lib")
          set(glfw3_LIBRARY "$lib")
          "@ | Set-Content glfw_deps/glfw3Config.cmake
          Write-Host "GLFW lib: $lib"

          # --- GLEW (static) ---
          Invoke-WebRequest -Uri "https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0-win32.zip" -OutFile glew.zip
          Expand-Archive glew.zip -DestinationPath glew_tmp -Force
          $glewDir = Get-ChildItem -Directory glew_tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force glew_deps/include | Out-Null
          New-Item -ItemType Directory -Force glew_deps/lib | Out-Null
          Copy-Item "$($glewDir.FullName)/include/*" glew_deps/include -Recurse -Force
          $glewLib = Get-ChildItem -Path $glewDir.FullName -Recurse -Filter glew32s.lib |
                     Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $glewLib) {
            $glewLib = Get-ChildItem -Path $glewDir.FullName -Recurse -Filter glew32s.lib | Select-Object -First 1
          }
          if (-not $glewLib) { throw 'glew32s.lib not found in GLEW package' }
          Copy-Item $glewLib.FullName glew_deps/lib/
          Write-Host "GLEW static lib: $($glewLib.FullName)"

      - name: Configure
        shell: pwsh
        run: |
          $root = $PWD.Path -replace '\\','/'
          cmake -B build -S . `
            -Dglfw3_DIR="$root/glfw_deps" `
            -DCMAKE_PREFIX_PATH="$root/glfw_deps"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # GLFW and GLEW are linked statically, so the exe stands alone and the
      # zip is what a player downloads.
      - name: Package release
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/blockforge.exe -DestinationPath blockforge-windows.zip -Force
          Get-Item blockforge-windows.zip | Select-Object Name, Length

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockforge-windows
          path: |
            build/Release/blockforge.exe
            build/Release/*.dll
            blockforge-windows.zip
